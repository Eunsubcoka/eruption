services:
  mysql:
    image: mysql:8
    container_name: eruption-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: eruption
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:7
    container_name: eruption-redis
    ports:
      - "6379:6379"
volumes:
  mysql-data: